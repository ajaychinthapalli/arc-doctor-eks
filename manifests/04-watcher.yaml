# CronJob that watches ARC and calls the arc-doctor agent over A2A.
# The script is mounted from a ConfigMap generated by kustomization.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-watcher
  namespace: arc-systems
  labels:
    app.kubernetes.io/part-of: arc-doctor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arc-watcher
  labels:
    app.kubernetes.io/part-of: arc-doctor
rules:
  - apiGroups: ["actions.github.com"]
    resources: ["autoscalingrunnersets", "ephemeralrunners"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arc-watcher
  labels:
    app.kubernetes.io/part-of: arc-doctor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: arc-watcher
subjects:
  - kind: ServiceAccount
    name: arc-watcher
    namespace: arc-systems
---
# Cooldown state lives in one ConfigMap in arc-systems.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-watcher-state
  namespace: arc-systems
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["arc-doctor-state"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-watcher-state
  namespace: arc-systems
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arc-watcher-state
subjects:
  - kind: ServiceAccount
    name: arc-watcher
    namespace: arc-systems
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arc-watcher
  namespace: arc-systems
  labels:
    app.kubernetes.io/part-of: arc-doctor
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: arc-watcher
        spec:
          serviceAccountName: arc-watcher
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watcher
              # Ships bash, kubectl, jq and curl. Pin to your cluster's minor version.
              image: alpine/k8s:1.31.4
              command: ["bash", "/scripts/arc-watch.sh"]
              env:
                - name: HOME
                  value: /tmp
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: CONTROLLER_NAMESPACE
                  value: arc-systems
                - name: A2A_URL
                  value: http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/arc-doctor/
                - name: PENDING_THRESHOLD_SECONDS
                  value: "300"
                - name: COOLDOWN_SECONDS
                  value: "1800"
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: arc-doctor-slack
                      key: webhook-url
                      optional: true
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: arc-watcher-script
            - name: tmp
              emptyDir: {}
